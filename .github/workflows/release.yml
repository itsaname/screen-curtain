name: Release v1.3.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: ScreenCurtain 1.3.1
          body_path: dist/1.3.1/RELEASE-NOTES.md
          files: |
            dist/1.3.1/installer/ScreenCurtain-Setup-1.3.1.exe
            dist/1.3.1/portable/ScreenCurtain-1.3.1-portable.zip
            dist/1.3.1/SHA256SUMS.txt
          fail_on_unmatched_files: true
